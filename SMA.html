<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SMA 專業回測系統 </title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { grid-column: span 2; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        
        .progress-wrapper { display: none; margin: 20px 0; }
        .progress-bar { height: 12px; background: #eee; border-radius: 6px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.1s; }
        
        .results-grid { display: grid; grid-template-columns: 400px 1fr; gap: 20px; margin-top: 30px; }
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .stats-card { background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); }
        
        .rank-table-wrapper { max-height: 550px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #f8f9fa; position: sticky; top: 0; z-index: 1; }

        #topTable tbody tr { cursor: pointer; transition: 0.2s; }
        #topTable tbody tr:hover { background: #e3f2fd; }
        #topTable tbody tr.selected { background: #bbdefb; font-weight: bold; }

        .trade-table-wrapper { max-height: 400px; overflow-y: auto; border: 1px solid #eee; margin-top: 10px; }
        .buy-text { color: var(--success); font-weight: bold; }
        .sell-text { color: var(--danger); font-weight: bold; }
        .final-text { color: #8e44ad; font-weight: bold; font-style: italic; }
        
        #chartContainer { width: 100%; height: 500px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>SMA 均線回測 </h1>

    <div class="input-section">
        <div class="input-group"><label>初始資金</label><input id="initialCash" type="number" value="10000"></div>
        <div class="input-group"><label>選擇公司</label><select id="companySelect"><option>請先上傳 CSV</option></select></div>
        <div class="input-group"><label>起始日期</label><input id="startDate" type="date" value="2024-01-01"></div>
        <div class="input-group"><label>結束日期</label><input id="endDate" type="date" value="2024-12-31"></div>
        <div class="input-group" style="grid-column: span 2;"><label>上傳 CSV 檔案</label><input id="csvFile" type="file" accept=".csv"></div>
        <button id="runBtn" onclick="runOptimization()">開始全參數最佳化</button>
    </div>

    <div class="progress-wrapper" id="progWrapper">
        <label id="progLabel">計算進度...</label>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>

    <div class="results-grid">
        <div class="side-panel">
            <div id="bestResult" class="stats-card">尚未執行</div>
            <h3>🏆 排行榜 (Top 20)</h3>
            <div class="rank-table-wrapper">
                <table id="topTable">
                    <thead><tr><th>排名</th><th>短/長</th><th>最終資產 </th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div>
            <div id="chartContainer"><canvas id="mainChart"></canvas></div>
            <h3 id="tableTitle">📑 交易明細 </h3>
            <div class="trade-table-wrapper">
                <table id="tradeTable">
                    <thead><tr><th>日期</th><th>動作</th><th>價格</th><th>股數</th><th>獲利</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let g_backtestData = [];
    let g_allSma = {};
    let g_startIdx = 0;
    let g_initialCash = 0;
    let chartInstance = null;
    const MAX_PERIOD = 256;

    // 修正：顯示小數點後兩位，並加上千分位
    function formatCurrency(num) {
        return num.toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function dateToInt(dStr) {
        if (!dStr) return 0;
        const parts = dStr.includes('-') ? dStr.split('-') : dStr.split('/');
        if (parts.length !== 3) return 0;
        const [y, m, d] = dStr.includes('-') ? parts : [parts[2], parts[0], parts[1]];
        return parseInt(y + m.padStart(2, '0') + d.padStart(2, '0'));
    }

    document.getElementById('csvFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const lines = event.target.result.trim().split("\n");
            window.csvHeaders = lines[0].split(",").map(h => h.trim());
            window.csvRaw = lines.slice(1).map(line => line.split(","));
            const select = document.getElementById("companySelect");
            select.innerHTML = window.csvHeaders.slice(1).map(h => `<option value="${h}">${h}</option>`).join('');
        };
        reader.readAsText(e.target.files[0]);
    });

    function precomputeSMA(data, period) {
        let sma = []; let sum = 0;
        for (let i = 0; i < data.length; i++) {
            sum += data[i].close;
            if (i >= period) sum -= data[i - period].close;
            sma.push(i >= period - 1 ? sum / period : null);
        }
        return sma;
    }

    function backtest(data, smaS, smaL, initialCash, startIdx, recordTrades = false) {
        let cash = initialCash, shares = 0, distCap = 0, hasPos = false;
        let maxValue = initialCash, maxDD = 0;
        let trades = [];

        for (let i = startIdx; i < data.length; i++) {
            const price = data[i].close;
            const isLastDay = (i === data.length - 1);
            
            if (!hasPos && !isLastDay && i > 0 && smaS[i-1] < smaL[i-1] && smaS[i] >= smaL[i]) {
                shares = Math.floor(cash / price);
                if (shares > 0) {
                    distCap = cash; cash -= (shares * price); hasPos = true;
                    if (recordTrades) trades.push({ date: data[i].date, action: '買入', price, shares });
                }
            } 
            else if (hasPos && i > 0 && smaS[i-1] > smaL[i-1] && smaS[i] <= smaL[i]) {
                let sellVal = shares * price;
                if (recordTrades) trades.push({ date: data[i].date, action: '賣出', price, shares, profit: (cash + sellVal) - distCap });
                cash += sellVal; shares = 0; hasPos = false;
            }
            else if (hasPos && isLastDay) {
                let sellVal = shares * price;
                if (recordTrades) trades.push({ date: data[i].date, action: '賣出(平倉)', price, shares, profit: (cash + sellVal) - distCap });
                cash += sellVal; shares = 0; hasPos = false;
            }
            let currentVal = cash + (shares * price);
            maxValue = Math.max(maxValue, currentVal);
            maxDD = Math.max(maxDD, (maxValue - currentVal) / maxValue);
        }
        return { finalAsset: cash, maxDD: maxDD * 100, trades };
    }

    async function runOptimization() {
        const btn = document.getElementById('runBtn');
        g_initialCash = parseFloat(document.getElementById('initialCash').value);
        const company = document.getElementById('companySelect').value;
        const sInt = dateToInt(document.getElementById('startDate').value);
        const eInt = dateToInt(document.getElementById('endDate').value);

        if (!window.csvRaw) return alert("請先上傳 CSV");

        let data = window.csvRaw.map(r => ({ date: r[0], close: parseFloat(r[window.csvHeaders.indexOf(company)]) }))
                             .filter(d => !isNaN(d.close))
                             .sort((a, b) => dateToInt(a.date) - dateToInt(b.date));

        g_startIdx = data.findIndex(d => dateToInt(d.date) >= sInt);
        const endIdx = data.findLastIndex(d => dateToInt(d.date) <= eInt);
        g_backtestData = data.slice(0, endIdx + 1);

        btn.disabled = true;
        document.getElementById('progWrapper').style.display = 'block';

        g_allSma = {};
        for (let p = 1; p <= MAX_PERIOD; p++) g_allSma[p] = precomputeSMA(g_backtestData, p);

        let results = [];
        for (let s = 1; s <= MAX_PERIOD; s++) {
            if (s % 16 === 0) {
                document.getElementById('progFill').style.width = (s/MAX_PERIOD*100) + "%";
                await new Promise(r => setTimeout(r, 0));
            }
            for (let l = 1; l <= MAX_PERIOD; l++) {
                let res = backtest(g_backtestData, g_allSma[s], g_allSma[l], g_initialCash, g_startIdx);
                results.push({ s, l, ...res });
            }
        }

        // --- C++ 邏輯排序 (不變) ---
        results.sort((a, b) => {
            if (Math.abs(a.finalAsset - b.finalAsset) > 0.01) return b.finalAsset - a.finalAsset;
            let diffA = Math.abs(a.s - a.l);
            let diffB = Math.abs(b.s - b.l);
            if (diffA !== diffB) return diffB - diffA; 
            if (a.s !== b.s) return a.s - b.s;
            return a.l - b.l;
        });

        updateRankTable(results.slice(0, 20)); 
        showSpecificResult(results[0].s, results[0].l, 1);

        btn.disabled = false;
        document.getElementById('progWrapper').style.display = 'none';
    }

    function updateRankTable(top) {
        const tbody = document.querySelector("#topTable tbody");
        tbody.innerHTML = top.map((r, i) => 
            `<tr onclick="showSpecificResult(${r.s}, ${r.l}, ${i+1}, this)">
                <td>${i+1}</td><td>${r.s}/${r.l}</td><td>$${formatCurrency(r.finalAsset)}</td>
            </tr>`).join('');
    }

    function showSpecificResult(s, l, rank, element = null) {
        if (element) {
            document.querySelectorAll('#topTable tbody tr').forEach(tr => tr.classList.remove('selected'));
            element.classList.add('selected');
        }
        const detailed = backtest(g_backtestData, g_allSma[s], g_allSma[l], g_initialCash, g_startIdx, true);
        document.getElementById('bestResult').innerHTML = `
            <h3>⭐ 組合: ${s}/${l} (Rank ${rank})</h3>
            <p>最終資產: $${formatCurrency(detailed.finalAsset)}</p>
            <p>最大回撤: ${detailed.maxDD.toFixed(2)}%</p>
        `;
        document.querySelector("#tradeTable tbody").innerHTML = detailed.trades.map(t => `
            <tr>
                <td>${t.date}</td>
                <td class="${t.action==='買入'?'buy-text':(t.action==='賣出(平倉)'?'final-text':'sell-text')}">${t.action}</td>
                <td>$${t.price}</td><td>${t.shares}</td>
                <td>${t.profit ? '$' + formatCurrency(t.profit) : '-'}</td>
            </tr>
        `).join('');
        renderChart(g_backtestData.slice(g_startIdx), g_allSma[s].slice(g_startIdx), g_allSma[l].slice(g_startIdx), detailed.trades, s, l);
    }

    function renderChart(data, sS, sL, trades, sVal, lVal) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.date),
                datasets: [
                    { label: '買入', data: data.map(d => trades.find(t => t.date === d.date && t.action === '買入') ? d.close : null), borderColor: 'green', backgroundColor: 'green', pointStyle: 'triangle', pointRadius: 8, showLine: false },
                    { label: '賣出/平倉', data: data.map(d => trades.find(t => t.date === d.date && (t.action === '賣出' || t.action === '賣出(平倉)')) ? d.close : null), borderColor: 'red', backgroundColor: 'red', pointStyle: 'rectRot', pointRadius: 8, showLine: false },
                    { label: '收盤價', data: data.map(d => d.close), borderColor: '#ddd', borderWidth: 1, pointRadius: 0 },
                    { label: `SMA ${sVal}`, data: sS, borderColor: '#e74c3c', borderWidth: 2, pointRadius: 0 },
                    { label: `SMA ${lVal}`, data: sL, borderColor: '#3498db', borderWidth: 2, pointRadius: 0 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }
</script>
</body>
</html>
